<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katorire</title>  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      text-align: center;
      color: #666;
    }
  </style></head><body>  <header>
    <h1>Katorire</h1>
    <p>A new platform built for the future</p>
  </header>  <div class="container">
    <div class="card">
      <h2>Welcome to Katorire</h2>
      <p>
        Katorire is a platform we are building step by step.
        More features will be added as the project grows.
      </p>  <div class="buttons">
    <button class="primary">Create Account</button>
    <button class="secondary">Login</button>
  </div>
</div>

  </div>  <footer>
    © 2026 Katorire. All rights reserved.
  </footer></body>
</html>
